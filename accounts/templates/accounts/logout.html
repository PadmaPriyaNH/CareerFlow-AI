{% extends 'base.html' %}
{% block title %}Logged Out | CareerFlow AI{% endblock %}
{% block content %}
<div class="container py-4 py-md-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-11 col-md-8 col-lg-5">
      <div class="card shadow-lg border-0">
        <div class="card-header bg-gradient text-white text-center" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <h3 class="mb-0" style="font-size: clamp(1.1rem, 2.5vw, 1.5rem);"><i class="fas fa-sign-out-alt me-2"></i>Logged Out</h3>
        </div>
        <div class="card-body p-4 text-center">
          <p class="lead mb-4" style="font-size: clamp(1rem, 2vw, 1.2rem);">You have been successfully logged out.</p>
          <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100"><i class="fas fa-sign-in-alt me-2"></i><span class="d-none d-sm-inline">Login Again</span><span class="d-inline d-sm-none">Login</span></a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
